[workspace]
resolver = "2"
members = ["crates/pdo-daemon"]

[workspace.package]
edition = "2021"
version = "1.36.1"
license = "MIT"
description = "Prompt-Driven Orchestrator — a local daemon that runs and supervises agentic coding pipelines"
repository = "https://github.com/Loulen/prompt-driven-orchestrator"
homepage = "https://github.com/Loulen/prompt-driven-orchestrator"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9"
# Workflow importer (#155 / ADR-0016): parse Claude Code workflow .js via an AST,
# never executing untrusted JS. Pinned to =0.133.0 — the last release whose MSRV
# (rust-version 1.93.0) matches this machine's floating nightly; 0.134+ bumps the
# MSRV to 1.94.0. The only API delta at 0.133 is `ParserReturn.errors` (vs
# `.diagnostics` in 0.138). See docs/adr/0016 (Decision T).
oxc_allocator = "=0.133.0"
oxc_parser = "=0.133.0"
oxc_span = "=0.133.0"
oxc_ast = "=0.133.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
notify = { version = "7", features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"
portable-pty = "0.8"
pretty_assertions = "1"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
sha2 = "0.10"

# --- Release packaging (dist / ex-cargo-dist) -------------------------------
# `dist` génère .github/workflows/release.yml à partir de cette config (voir
# `dist generate`). Cutover depuis le release.yml fait main : le job GHCR sandbox,
# additif et sans `needs:`, a été extrait dans .github/workflows/sandbox-image.yml
# (même trigger `push: tags v*`) pour survivre à la régénération.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
# Pas de Windows (couplage systemd/launchd) : shell + Homebrew suffisent pour un
# public dev Linux+macOS. Le curl|sh de dist remplace l'ancien install.sh fait main.
installers = ["shell", "homebrew"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
# Tap public préexistant ; le job `homebrew` y pousse la formule via le secret
# HOMEBREW_TAP_TOKEN (PAT scope repo) à définir sur le repo source.
tap = "Loulen/homebrew-tap"
publish-jobs = ["homebrew"]
# Nom de la formule = `pdo` (pas le nom de package `pdo-daemon`) -> `brew install
# Loulen/tap/pdo`. Sans ça, dist dérive tout du package et publierait `pdo-daemon.rb`.
# (L'installeur shell reste `pdo-daemon-installer.sh` : renommer AUSSI ça imposerait
# de renommer le package Cargo — chantier à part.)
formula = "pdo"
# Étapes injectées AVANT `dist build` : Node + `pnpm install` dans frontend/, car le
# build.rs de pdo-daemon lance `pnpm run build` pendant `cargo build` (rust-embed).
github-build-setup = "../build-setup.yml"
# Parité avec l'unité systemd/launchd (`pdo service install` lit current_exe) et
# avec l'ancien install.sh : binaire dans ~/.local/bin.
install-path = "~/.local/bin"
# Les PR ne construisent que le plan ; rien ne publie hors tag `v*`.
pr-run-mode = "plan"

# Profil de build utilisé par `dist build` (`cargo build --profile dist`). Requis :
# sans lui, la release échoue avec « error: profile `dist` is not defined ». Normalement
# posé par `dist init` ; ici la config a été écrite à la main. Standard dist : hérite de
# `release` (ce que l'ancien install.sh shippait) + thin LTO.
[profile.dist]
inherits = "release"
lto = "thin"

# --- Profils dev / test (empreinte disque du target) ------------------------
# Les 50 binaires de tests d’intégration de pdo-daemon liaient chacun
# libpdo_daemon en statique. Au `debug = 2` par défaut de cargo, un binaire pèse
# ~254 Mo dont ~202 Mo de sections `.debug_*` (.debug_str 87 Mo, .debug_info
# 78 Mo, .debug_line 20 Mo) : le debug info EST le target/.
#
# `line-tables-only` ne garde que la table de lignes et jette les DIE de types.
# Concrètement : les backtraces gardent `fichier:ligne` (ce dont on se sert au
# quotidien), on perd l'inspection de variables au débogueur (ce qu'on ne fait
# pas ici). Compromis assumé.
#
# `incremental = false` : PDO donne à chaque itération de node un worktree neuf,
# donc un `target/` neuf. Le cache incrémental (2 à 3,6 Go par worktree) est
# écrit puis jamais relu, c'est du poids mort pur. Le vrai cache inter-worktrees
# est sccache (voir .cargo/config.toml), qui vit hors de target/.
# ATTENTION : ce raisonnement S'INVERSE si un CARGO_TARGET_DIR partagé atterrit
# un jour (issues #518 / #631). Le cache serait alors relu d'une itération sur
# l'autre et `incremental = true` redeviendrait le bon défaut.
[profile.dev]
debug = "line-tables-only"
incremental = false

# `test` hérite déjà de `dev` chez cargo, donc ce bloc est redondant en l'état.
# On le pose quand même explicitement : ce sont les binaires de tests qui
# portent l'essentiel des 202 Mo, et on ne veut pas que le gain dépende d'un
# héritage implicite qu'un futur `[profile.test]` (ajouté pour tout autre
# raison) ferait sauter sans bruit.
[profile.test]
debug = "line-tables-only"
incremental = false
