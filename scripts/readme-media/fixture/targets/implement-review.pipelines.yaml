name: implement-review
version: "1.0"
nodes:
  - id: start
    name: Start
    type: start
    outputs:
      - { name: user_prompt }
    view: { x: 270, y: 60 }
  - id: end
    name: End
    type: end
    inputs:
      - { name: result }
    view: { x: 272, y: 250 }
  - id: implementer
    name: implementer
    type: agent
    isolated_worktree: false
    pin_harness: claude
    harnesses:
      claude: { model: claude-opus-5-5, effort: medium }
    inputs:
      - { name: task }
    outputs:
      - { name: code }
    view: { x: 196, y: 130 }
edges:
  - source: { node: start, port: user_prompt }
    target: { node: implementer, port: task }
    mode: manual
    waypoints:
      - { x: 300, y: 107 }
    target_side: top
    source_anchor: { side: bottom, offset: 30 }
    target_anchor: { side: top, offset: 104 }
  - source: { node: implementer, port: code }
    target: { node: end, port: result }
    mode: manual
    waypoints:
      - { x: 300, y: 225 }
    target_side: top
    source_anchor: { side: bottom, offset: 104 }
    target_anchor: { side: top, offset: 28 }
