[package]
# The `settings` bounded context (ADR-0079): the instance settings page — the
# stored tier of every context's instance defaults, assembled into one surface —
# and the agentic profiles. Hexagonal inside: `domain/`, `application/` (ports +
# one use case per file), `adapters/`. The last context of the map: it depends
# on the others, never the other way round.
name = "pdo-settings"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PDO's settings context: the instance settings page and the agentic profiles"
publish = false
autotests = false

[lib]
name = "pdo_settings"
path = "src/lib.rs"

[dependencies]
pdo-kernel.workspace = true
pdo-harness.workspace = true
pdo-platform.workspace = true
pdo-pipeline.workspace = true
pdo-review.workspace = true
pdo-run.workspace = true
pdo-sandbox.workspace = true
pdo-session.workspace = true
pdo-skill.workspace = true
pdo-telemetry.workspace = true
pdo-trigger.workspace = true
pdo-workspace.workspace = true
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true

[[test]]
name = "use_cases"
path = "tests/use_cases/main.rs"

[[test]]
name = "adapters"
path = "tests/adapters/main.rs"

[dev-dependencies]
pdo-extension-api.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
