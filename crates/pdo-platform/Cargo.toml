[package]
# The `platform` bounded context (ADR-0079): the daemon as an installed piece of
# software — its mounted pages, its version check and self-update, its out-of-Run
# audit journal, its OS service unit. Hexagonal inside: `domain/`,
# `application/` (ports + one use case per file), `adapters/`.
name = "pdo-platform"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PDO's platform context: page mounts, version check and update, audit journal, service unit"
publish = false

[dependencies]
pdo-kernel.workspace = true
# The audit journal returns the Actor of a row and its display name (`ts`: their
# TypeScript, like the daemon's).
pdo-extension-api = { workspace = true, features = ["ts"] }
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
libc = "0.2"
mime_guess.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
