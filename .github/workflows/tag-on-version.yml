name: Tag on version bump

# « Bump = release » : la version dans Cargo.toml ([workspace.package]) est la
# source de vérité. À chaque push sur main, si aucun tag `v{version}` n'existe,
# on le crée — ce qui déclenche le workflow dist (release.yml) → release GitHub +
# formule Homebrew. Concrètement : bumpez la version dans votre branche, mergez,
# c'est releasé. Un push qui ne change pas la version (docs, fix sans bump) est
# un no-op tant que le tag courant existe déjà.
#
# Le tag est poussé avec un PAT (secret RELEASE_PLZ_TOKEN, hérité de l'ancien
# release-plz), PAS le GITHUB_TOKEN par défaut : un tag poussé par le bot Actions
# ne déclenche aucun workflow, donc dist ne partirait jamais. Le même PAT sert au
# push de la formule Homebrew (secret HOMEBREW_TAP_TOKEN).

on:
  push:
    branches: [main]

concurrency:
  group: tag-on-version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT pour que le push du tag déclenche dist (le GITHUB_TOKEN par défaut ne le ferait pas).
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Créer v{version} si le tag manque
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} existe déjà — rien à releaser."
            exit 0
          fi
          echo "Création de ${tag} sur ${GITHUB_SHA}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "PDO ${tag}"
          git push origin "${tag}"
