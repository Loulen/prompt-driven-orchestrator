<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Driven Orchestrator</title>
    <!-- Theme guard (#759): stamps the resolved theme on <html> before the
         bundle loads, so the page never paints one theme and flips to the
         other. Deliberately duplicates the rule in `src/lib/theme.ts` — a
         module import would be too late; `src/noFlashTheme.test.ts` runs THIS
         script and asserts the two agree. Keep it dependency-free and total:
         a throwing store must not blank the page. -->
    <script>
      try {
        var stored = null;
        try {
          stored = localStorage.getItem("pdo.ui.theme");
        } catch (e) {}
        var osDark = true;
        try {
          osDark = matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        // Same rule as lib/theme.ts (#781): a stored light/dark/system is
        // honoured (system resolves against the OS); anything else — nothing
        // stored, unknown value — falls back to DARK, the look PDO has always
        // had, whatever the OS asks for.
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : stored === "system"
              ? osDark
                ? "dark"
                : "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
