name: review-loop
version: '1.0'
nodes:
- id: start
  name: Start
  type: start
  outputs:
  - name: user_prompt
    side: right
- id: XBG5Cxkn
  name: implementer
  type: code-mutating
  view:
    x: 335
    y: 249
  outputs:
  - name: code
    side: right
- id: Qws9KzRZ
  name: reviewer
  type: doc-only
  view:
    x: 500
    y: 100
  outputs:
  - name: review
    side: right
    frontmatter:
      verdict:
        type: enum
        allowed:
        - PASS
        - APPROVED
        - FAIL
        - NEEDS_WORK
- id: end
  name: End
  type: end
  inputs:
  - name: result
    side: left
edges:
- source:
    node: XBG5Cxkn
    port: code
  target:
    node: Qws9KzRZ
    port: code
- source:
    node: start
    port: user_prompt
  target:
    node: XBG5Cxkn
    port: task
- source:
    node: Qws9KzRZ
    port: review
  target:
    node: end
    port: result
  when:
    verdict:
      in:
      - PASS
      - APPROVED
- source:
    node: Qws9KzRZ
    port: review
  target:
    node: XBG5Cxkn
    port: task
  else: true
loops:
- id: loop
  kind: bounded
  members:
  - Qws9KzRZ
  - XBG5Cxkn
  max_iter: 3
