name: implement-review
version: "1.0"
nodes:
  - id: start
    name: Start
    type: start
    outputs:
      - { name: user_prompt }
    view: { x: 270, y: 60 }
  - id: end
    name: End
    type: end
    inputs:
      - { name: result }
    view: { x: 272, y: 424 }
  - id: implementer
    name: implementer
    type: agent
    isolated_worktree: false
    pin_harness: claude
    harnesses:
      claude: { model: claude-opus-5-5, effort: medium }
    inputs:
      - { name: task }
    outputs:
      - { name: code }
    view: { x: 196, y: 130 }
  - id: reviewer
    name: reviewer
    type: agent
    isolated_worktree: false
    pin_harness: claude
    harnesses:
      claude: { model: claude-opus-5-5, effort: medium }
    inputs:
      - { name: code }
    outputs:
      - name: review
        frontmatter:
          verdict:
            allowed: [pass, fail]
            type: enum
        instructions: "Your verdict, then a small Mermaid diagram of the flow you checked."
      - name: screenshots
        port_type: image_list
        instructions: "Screenshots of the app, annotated with Pillow."
    view: { x: 196, y: 236 }
edges:
  - source: { node: start, port: user_prompt }
    target: { node: implementer, port: task }
    mode: manual
    waypoints:
      - { x: 300, y: 107 }
    target_side: top
    source_anchor: { side: bottom, offset: 30 }
    target_anchor: { side: top, offset: 104 }
  - source: { node: implementer, port: code }
    target: { node: reviewer, port: code }
    mode: manual
    waypoints:
      - { x: 300, y: 218 }
    target_side: top
    source_anchor: { side: bottom, offset: 104 }
    target_anchor: { side: top, offset: 104 }
  - source:
      node: reviewer
      ports: [review, screenshots]
    target: { node: implementer, port: task }
    when:
      review.verdict: { eq: fail }
    mode: manual
    waypoints:
      - { x: 452, y: 162 }
      - { x: 451, y: 162 }
    target_side: right
    source_anchor: { side: right, offset: 40 }
    target_anchor: { side: right, offset: 32 }
    output_label_pos:
      review: { x: 420, y: 291 }
      screenshots: { x: 434, y: 310 }
    condition_label_pos: { x: 452, y: 216 }
  - source: { node: reviewer, port: review }
    target: { node: end, port: result }
    when:
      verdict: { eq: pass }
    mode: manual
    waypoints:
      - { x: 300, y: 380 }
    target_side: top
    source_anchor: { side: bottom, offset: 104 }
    target_anchor: { side: top, offset: 28 }
    output_label_pos:
      review: { x: 268, y: 352 }
    condition_label_pos: { x: 304, y: 392 }
loops:
  - id: loop-7d8ce70b3a6784e7
    kind: bounded
    members: [implementer, reviewer]
    max_iter: 5
