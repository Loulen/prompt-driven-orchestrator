[package]
# The legacy crate (ADR-0079): every bounded context is strangled out of it, one
# crate at a time, and it only shrinks. Deleted by #932.
#
# The package is `pdo-legacy`, but the library keeps its historical name
# `pdo_daemon`: `RUST_LOG=pdo_daemon::…` targets and every `use pdo_daemon::`
# stay valid until each context moves out. The package name `pdo-daemon` now
# belongs to the composition root (crates/pdo), which carries the `pdo` binary.
name = "pdo-legacy"
edition.workspace = true
version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
# The daemon's integration tests live with the composition root
# (crates/pdo/tests): they drive the `pdo` binary, which lives there.
autotests = false

[lib]
name = "pdo_daemon"
path = "src/lib.rs"

[dependencies]
pdo-kernel.workspace = true
pdo-workspace.workspace = true
pdo-skill.workspace = true
pdo-platform.workspace = true
pdo-harness.workspace = true
pdo-sandbox.workspace = true
pdo-session.workspace = true
ts-rs.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_yaml.workspace = true
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
oxc_ast.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
portable-pty.workspace = true
futures-util = "0.3"
libc = "0.2"
sha2.workspace = true
# TLS via rustls (pure-Rust, `ring`) instead of the default native-tls/OpenSSL:
# openssl-sys can't cross-compile to aarch64-unknown-linux-gnu in the release
# build (no target OpenSSL). rustls removes the C dependency entirely.
reqwest.workspace = true
# Skills sidecar of the portable pipeline document (#673 / ADR-0062): base64 in
# the import request (the zip itself belongs to the skill context).
base64 = "0.22"

[dev-dependencies]
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }
pretty_assertions.workspace = true
insta.workspace = true
tempfile.workspace = true
filetime = "0.2"
chrono-tz = "0.10"
