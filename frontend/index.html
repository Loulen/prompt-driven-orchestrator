<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acogni Driver</title>
    <link rel="icon" type="image/svg+xml" href="/shared/favicon.svg" />
    <!-- The theme script (ADR-0093): stamps the Theme and the mode on <html>
         before the bundle loads, so the page never paints one look and flips
         to the other. The same file a page an extension serves outside the
         interface loads; `src/noFlashTheme.test.ts` runs it against
         `src/lib/theme.ts`. -->
    <script src="/shared/theme.js"></script>
    <!-- The UI scale, stamped before the bundle loads for the same reason.
         Keep it dependency-free and total: a throwing store must not blank
         the page. -->
    <script>
      // Same rule as lib/uiScale.ts: a stored 100, 110 or 120, else 120.
      try {
        var scale = null;
        try {
          scale = Number(localStorage.getItem("pdo.ui.scale"));
        } catch (e) {}
        if (scale !== 100 && scale !== 110 && scale !== 120) scale = 120;
        document.documentElement.style.setProperty("--app-zoom", String(scale / 100));
      } catch (e) {}
    </script>
    <!-- The React the extensions' UI bundles import (ADR-0081): the front's own,
         shared through these shims (public/shared/), never a second copy. A
         bundle declaring another React major is not loaded at all
         (src/shared/extensions/). `@pdo/extension-ui` is the shared module that
         renders the locations an extension hosts (amendment #32), checked by
         major the same way. -->
    <script type="importmap">
      {
        "imports": {
          "react": "/shared/react.js",
          "react/jsx-runtime": "/shared/react-jsx-runtime.js",
          "react-dom": "/shared/react-dom.js",
          "@pdo/extension-ui": "/shared/pdo-extension-ui.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
