name: orphan-to-end
nodes:
  - id: start
    name: Start
    type: start
    outputs:
      - name: user_prompt
  - id: end
    name: End
    type: end
    inputs:
      - name: result
  - id: implementer
    name: implementer
    type: agent
    isolated_worktree: false
    outputs:
      - name: out
  - id: stray
    name: stray
    type: agent
    isolated_worktree: false
    outputs:
      - name: out
edges:
  - source: { node: start, port: user_prompt }
    target: { node: implementer, port: task }
  - source: { node: implementer, port: out }
    target: { node: end, port: result }
  - source: { node: stray, port: out }
    target: { node: end, port: result }
