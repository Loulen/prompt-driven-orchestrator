# Config release-plz — voir .github/workflows/release-plz.yml pour le flux.
[workspace]
# dist possède la release GitHub (artefacts + formule Homebrew). release-plz ne
# fait QUE bump de version + tag + CHANGELOG : sans ça, les deux créeraient une
# release GitHub sur le même tag et se collisionneraient.
git_release_enable = false

# Tag `vX.Y.Z` : matche le trigger `v*` de dist ET la convention existante
# (v1.27.0, ...). Défaut release-plz en workspace = `pdo-daemon-vX.Y.Z`, qui ne
# commence pas par `v` -> dist ne partirait jamais. Clé load-bearing.
git_tag_name = "v{{ version }}"

# PDO est une application, pas une bibliothèque : jamais de `cargo publish`.
# (Doublé par `publish = false` dans crates/pdo-daemon/Cargo.toml.)
publish = false
