# The « Bug report » issue form. PDO's « Report a bug » window opens it with
# every field prefilled: each field's `id` is the query parameter it reads
# (`issues/new?template=bug_report.yml&description=…`). Keep the ids in step
# with frontend/src/platform/model/bugReportGithub.ts.
name: Bug report
description: Something in PDO does not work as it should.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Filed from PDO (Ctrl+K › Report a bug…), the fields below are already filled in.
        Never paste a prompt, an artifact or an agent's output here: this tracker is public.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, what you expected, and how to reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: PDO's version, as the status bar shows it.
      placeholder: PDO 2.81.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: The system the daemon runs on.
      placeholder: Linux 6.8.0 (x86_64)
  - type: input
    id: harnesses
    attributes:
      label: Harnesses
      description: The installed harnesses and their versions (Settings › Diagnostics).
      placeholder: claude 2.1.322 · opencode 1.0.85
  - type: textarea
    id: run
    attributes:
      label: Run details
      description: The Run's status, each node's status, the failure reasons and the durations. No artifact, no output.
  - type: textarea
    id: pipeline
    attributes:
      label: Pipeline details
      description: The Pipeline's structure (nodes, types, harnesses, isolation, edges). No prompt.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Paste a screenshot here (PDO copies it to your clipboard when it opens this issue).
