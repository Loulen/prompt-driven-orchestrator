name: prod-check
version: "1.0"
nodes:
  - id: start
    name: Start
    type: start
    outputs:
      - { name: user_prompt }
    view: { x: 270, y: 20 }
  - id: end
    name: End
    type: end
    inputs:
      - { name: result }
    view: { x: 272, y: 430 }
  - id: RlRyUvAz
    name: Incident-debugger
    type: agent
    isolated_worktree: false
    inputs:
      - { name: in }
    outputs:
      - name: incidents
        frontmatter:
          Incident_found: { type: bool }
    view: { x: 196, y: 90 }
  - id: wHpeFwT0
    name: Orchestrate Fix
    type: agent
    isolated_worktree: false
    orchestrator: true
    skills:
      - { id: pdo-orchestrate, name: pdo-orchestrate }
    inputs:
      - { name: in }
    outputs:
      - name: report
        frontmatter:
          fixed: { type: bool }
    view: { x: 196, y: 215 }
  - id: XxIN3yX6
    name: Notify Slack
    type: agent
    isolated_worktree: false
    inputs:
      - { name: in }
    outputs:
      - { name: out }
    view: { x: 196, y: 320 }
edges:
  - source: { node: RlRyUvAz, port: incidents }
    target: { node: wHpeFwT0, port: in }
    when:
      Incident_found: { eq: true }
    mode: manual
    waypoints:
      - { x: 300, y: 185 }
    target_side: top
    source_anchor: { side: bottom, offset: 104 }
    target_anchor: { side: top, offset: 104 }
    condition_label_pos: { x: 300, y: 185 }
  - source: { node: RlRyUvAz, port: incidents }
    target: { node: end, port: result }
    when:
      Incident_found: { eq: false }
    mode: manual
    waypoints:
      - { x: 150, y: 442 }
    source_anchor: { side: left, offset: 32 }
    target_anchor: { side: left, offset: 12 }
    condition_label_pos: { x: 110, y: 290 }
  - source: { node: wHpeFwT0, port: report }
    target: { node: XxIN3yX6, port: in }
    mode: manual
    waypoints:
      - { x: 300, y: 300 }
    target_side: top
    source_anchor: { side: bottom, offset: 104 }
    target_anchor: { side: top, offset: 104 }
  - source: { node: XxIN3yX6, port: out }
    target: { node: end, port: result }
    mode: manual
    waypoints:
      - { x: 300, y: 408 }
    target_side: top
    source_anchor: { side: bottom, offset: 104 }
    target_anchor: { side: top, offset: 28 }
  - source: { node: start, port: user_prompt }
    target: { node: RlRyUvAz, port: in }
    mode: manual
    waypoints:
      - { x: 300, y: 67 }
    target_side: top
    source_anchor: { side: bottom, offset: 30 }
    target_anchor: { side: top, offset: 104 }
