# Settings come from .env (copy .env.example to .env and fill it in).
name: pdo

services:
  pdo:
    build:
      context: .
      args:
        COPILOT_VERSION: "${COPILOT_VERSION:-1.0.98}"
        PDO_VERSION: "${PDO_VERSION:-1.126.0}"
    image: pdo:local
    container_name: pdo
    hostname: pdo
    init: false                 # tini is the image entrypoint
    restart: unless-stopped
    ports:
      - "127.0.0.1:5172:5172"
    environment:
      GIT_USER_NAME: "${GIT_USER_NAME:-}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL:-}"
      PDO_ALLOWED_WS_ORIGINS: "${PDO_ALLOWED_WS_ORIGINS:-}"
    volumes:
      # The whole home: repos (~/work), PDO state (~/.pdo), Copilot auth (~/.copilot),
      # git and SSH config. Kept by `docker compose down`.
      - home:/home/dev

volumes:
  home:
