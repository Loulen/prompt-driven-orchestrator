[package]
# The `stats` bounded context (ADR-0079): the instance Stats cockpit — the
# Overview, Cost and Performance folds over the Runs' events, the absorptions
# that combine their rows, and the price table's sync. Hexagonal inside:
# `domain/` (the pure folds, the median, the absorption rules), `application/`
# (ports + one use case per file), `adapters/`.
name = "pdo-stats"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PDO's stats context: the instance Stats cockpit, its absorptions and the price sync"
publish = false
autotests = false

[lib]
name = "pdo_stats"
path = "src/lib.rs"

[dependencies]
pdo-kernel.workspace = true
pdo-harness.workspace = true
pdo-pipeline.workspace = true
pdo-platform.workspace = true
pdo-run.workspace = true
pdo-sandbox.workspace = true
pdo-workspace.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true

[[test]]
name = "use_cases"
path = "tests/use_cases/main.rs"

[[test]]
name = "adapters"
path = "tests/adapters/main.rs"

[dev-dependencies]
pdo-extension-api.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
filetime = "0.2"
tower = { version = "0.5", features = ["util"] }
